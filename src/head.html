<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bullet vs Water Balloon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  /* one deliberate look in every theme: a darkened high-speed studio with camera-style overlays */
  --bg: #0a0b0d; --panel: rgba(17, 19, 23, 0.94); --line: rgba(220, 228, 240, 0.09);
  --text: #e6e9ee; --muted: #98a1ad; --accent: #71b3ff; --accent2: #ffb56b; --warn: #ff7b72;
  --ui: "Barlow Semi Condensed", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.35 var(--ui); overflow: hidden; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#stage { position: fixed; inset: 0; right: var(--pw, 300px); bottom: 64px; }
body.nopanel #stage { right: 0; }
canvas#view { width: 100%; height: 100%; display: block; background: #000; touch-action: none; cursor: grab; }
canvas#view.drag { cursor: grabbing; }
#hud { position: absolute; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); pointer-events: none; text-shadow: 0 1px 2px #000; }
#hud .t { font: 500 22px/1.1 var(--mono); letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
#hud .s { color: var(--muted); margin-top: 3px; font-size: 12px; }
#hud .ph { color: var(--accent2); margin-top: 2px; font-size: 12px; }
#stats { position: absolute; right: 16px; top: calc(10px + env(safe-area-inset-top, 0px)); color: var(--muted); font: 11px var(--mono); text-align: right; pointer-events: none; text-shadow: 0 1px 2px #000; }
#views { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
#views button, .btn { background: rgba(30,33,38,0.85); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 9px; font: inherit; cursor: pointer; }
#views button:hover, .btn:hover { border-color: rgba(255,255,255,0.25); }
#views button.on { border-color: var(--accent); color: var(--accent); }
#timeline { position: fixed; left: 0; right: var(--pw, 300px); bottom: 0; height: calc(64px + env(safe-area-inset-bottom, 0px)); background: var(--panel);
  border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 16px env(safe-area-inset-bottom, 0px); }
body.nopanel #timeline { right: 0; }
#timeline .btn { min-width: 38px; height: 34px; font-size: 15px; }
#scrub { position: relative; flex: 1; height: 34px; cursor: pointer; }
#scrub .track { position: absolute; left: 0; right: 0; top: 15px; height: 4px; background: rgba(255,255,255,0.10); border-radius: 2px; }
#scrub .baked { position: absolute; left: 0; top: 15px; height: 4px; background: rgba(106,176,255,0.35); border-radius: 2px; width: 0; }
#scrub .head { position: absolute; top: 9px; width: 4px; height: 16px; background: var(--accent2); border-radius: 2px; margin-left: -2px; }
#scrub .tick { position: absolute; top: 22px; font-size: 10px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
#scrub .tick::before { content: ""; position: absolute; left: 50%; top: -6px; width: 1px; height: 5px; background: rgba(255,255,255,0.25); }
#tl-right { display: flex; flex-direction: column; gap: 2px; min-width: 150px; font-size: 11px; color: var(--muted); }
#tl-right input[type=range] { width: 150px; }
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--pw, 300px); background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 30px; }
body.nopanel #panel { display: none; }
#panel h1 { font-size: 17px; font-weight: 600; margin: 2px 0 2px; letter-spacing: 0.2px; text-wrap: balance; }
#panel .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 8px; }
details { border-top: 1px solid var(--line); padding: 6px 0; }
summary { cursor: pointer; font-weight: 600; padding: 3px 0; color: var(--text); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; margin: 7px 0 2px; }
.row label { color: var(--muted); font-size: 12px; }
.row .val { font: 11px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.row input[type=range], .row select { grid-column: 1 / 3; width: 100%; }
.row.check { grid-template-columns: auto 1fr; }
input[type=range] { accent-color: var(--accent); height: 16px; }
select { background: #1b1e23; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; font: inherit; }
.note { color: var(--muted); font-size: 11px; margin: 4px 0; }
.rebake::after { content: " ⟳"; color: var(--accent); font-size: 10px; }
#toggle { position: fixed; top: 8px; right: calc(var(--pw, 300px) + 8px); z-index: 3; }
body.nopanel #toggle { right: 8px; }
#err { position: fixed; left: 20px; right: 20px; top: 20px; background: #2a1215; color: #ffb4ae; border: 1px solid #6b2a2a; padding: 12px;
  border-radius: 8px; white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; display: none; z-index: 10; max-height: 80vh; overflow: auto; }
@media (max-width: 760px) {
  :root { --pw: 0px; }
  #panel { width: 100%; top: auto; height: 45vh; border-left: 0; border-top: 1px solid var(--line); }
  body:not(.nopanel) #stage { bottom: calc(45vh + 64px); right: 0; }
  body:not(.nopanel) #timeline { bottom: 45vh; right: 0; }
  #toggle { right: 8px; }
  #tl-right { display: none; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hud"><div class="t" id="hud-t">t = 0.000 ms</div><div class="ph" id="hud-ph"></div><div class="s" id="hud-s"></div></div>
  <div id="stats"></div>
  <div id="views"></div>
</div>
<button class="btn" id="toggle" title="Show/hide controls (H)">☰</button>
<div id="timeline">
  <button class="btn" id="b-restart" title="Restart (R)">⏮</button>
  <button class="btn" id="b-back" title="Step back (←)">◀︎</button>
  <button class="btn" id="b-play" title="Play / freeze (Space)">⏸</button>
  <button class="btn" id="b-fwd" title="Step forward (→)">▶︎</button>
  <div id="scrub"><div class="track"></div><div class="baked"></div><div class="head"></div></div>
  <div id="tl-right">
    <span id="rate-l">Playback 1×</span>
    <input type="range" id="rate" min="-1" max="1" step="0.01" value="0">
  </div>
</div>
<aside id="panel">
  <h1>Bullet vs. water balloon</h1>
  <div class="sub">Ray-traced fluid simulation. Drag to orbit, wheel to zoom, right-drag to pan. Space freezes time; a frozen frame keeps refining. Controls marked ⟳ re-run the simulation.</div>
  <div id="controls"></div>
</aside>
<div id="err"></div>
