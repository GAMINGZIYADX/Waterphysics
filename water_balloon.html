<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bullet vs Water Balloon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  /* one deliberate look in every theme: a darkened high-speed studio with camera-style overlays */
  --bg: #0a0b0d; --panel: rgba(17, 19, 23, 0.94); --line: rgba(220, 228, 240, 0.09);
  --text: #e6e9ee; --muted: #98a1ad; --accent: #71b3ff; --accent2: #ffb56b; --warn: #ff7b72;
  --ui: "Barlow Semi Condensed", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.35 var(--ui); overflow: hidden; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#stage { position: fixed; inset: 0; right: var(--pw, 300px); bottom: 64px; }
body.nopanel #stage { right: 0; }
canvas#view { width: 100%; height: 100%; display: block; background: #000; touch-action: none; cursor: grab; }
canvas#view.drag { cursor: grabbing; }
#hud { position: absolute; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); pointer-events: none; text-shadow: 0 1px 2px #000; }
#hud .t { font: 500 22px/1.1 var(--mono); letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
#hud .s { color: var(--muted); margin-top: 3px; font-size: 12px; }
#hud .ph { color: var(--accent2); margin-top: 2px; font-size: 12px; }
#stats { position: absolute; right: 16px; top: calc(10px + env(safe-area-inset-top, 0px)); color: var(--muted); font: 11px var(--mono); text-align: right; pointer-events: none; text-shadow: 0 1px 2px #000; }
#views { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
#views button, .btn { background: rgba(30,33,38,0.85); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 9px; font: inherit; cursor: pointer; }
#views button:hover, .btn:hover { border-color: rgba(255,255,255,0.25); }
#views button.on { border-color: var(--accent); color: var(--accent); }
#timeline { position: fixed; left: 0; right: var(--pw, 300px); bottom: 0; height: calc(64px + env(safe-area-inset-bottom, 0px)); background: var(--panel);
  border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 16px env(safe-area-inset-bottom, 0px); }
body.nopanel #timeline { right: 0; }
#timeline .btn { min-width: 38px; height: 34px; font-size: 15px; }
#scrub { position: relative; flex: 1; height: 34px; cursor: pointer; }
#scrub .track { position: absolute; left: 0; right: 0; top: 15px; height: 4px; background: rgba(255,255,255,0.10); border-radius: 2px; }
#scrub .baked { position: absolute; left: 0; top: 15px; height: 4px; background: rgba(106,176,255,0.35); border-radius: 2px; width: 0; }
#scrub .head { position: absolute; top: 9px; width: 4px; height: 16px; background: var(--accent2); border-radius: 2px; margin-left: -2px; }
#scrub .tick { position: absolute; top: 22px; font-size: 10px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
#scrub .tick::before { content: ""; position: absolute; left: 50%; top: -6px; width: 1px; height: 5px; background: rgba(255,255,255,0.25); }
#tl-right { display: flex; flex-direction: column; gap: 2px; min-width: 150px; font-size: 11px; color: var(--muted); }
#tl-right input[type=range] { width: 150px; }
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--pw, 300px); background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 30px; }
body.nopanel #panel { display: none; }
#panel h1 { font-size: 17px; font-weight: 600; margin: 2px 0 2px; letter-spacing: 0.2px; text-wrap: balance; }
#panel .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 8px; }
details { border-top: 1px solid var(--line); padding: 6px 0; }
summary { cursor: pointer; font-weight: 600; padding: 3px 0; color: var(--text); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; margin: 7px 0 2px; }
.row label { color: var(--muted); font-size: 12px; }
.row .val { font: 11px var(--mono); color: var(--text); font-variant-numeric: tabular-nums; }
.row input[type=range], .row select { grid-column: 1 / 3; width: 100%; }
.row.check { grid-template-columns: auto 1fr; }
input[type=range] { accent-color: var(--accent); height: 16px; }
select { background: #1b1e23; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; font: inherit; }
.note { color: var(--muted); font-size: 11px; margin: 4px 0; }
.rebake::after { content: " ⟳"; color: var(--accent); font-size: 10px; }
#toggle { position: fixed; top: 8px; right: calc(var(--pw, 300px) + 8px); z-index: 3; }
body.nopanel #toggle { right: 8px; }
#err { position: fixed; left: 20px; right: 20px; top: 20px; background: #2a1215; color: #ffb4ae; border: 1px solid #6b2a2a; padding: 12px;
  border-radius: 8px; white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; display: none; z-index: 10; max-height: 80vh; overflow: auto; }
@media (max-width: 760px) {
  :root { --pw: 0px; }
  #panel { width: 100%; top: auto; height: 45vh; border-left: 0; border-top: 1px solid var(--line); }
  body:not(.nopanel) #stage { bottom: calc(45vh + 64px); right: 0; }
  body:not(.nopanel) #timeline { bottom: 45vh; right: 0; }
  #toggle { right: 8px; }
  #tl-right { display: none; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hud"><div class="t" id="hud-t">t = 0.000 ms</div><div class="ph" id="hud-ph"></div><div class="s" id="hud-s"></div></div>
  <div id="stats"></div>
  <div id="views"></div>
</div>
<button class="btn" id="toggle" title="Show/hide controls (H)">☰</button>
<div id="timeline">
  <button class="btn" id="b-restart" title="Restart (R)">⏮</button>
  <button class="btn" id="b-back" title="Step back (←)">◀︎</button>
  <button class="btn" id="b-play" title="Play / freeze (Space)">⏸</button>
  <button class="btn" id="b-fwd" title="Step forward (→)">▶︎</button>
  <div id="scrub"><div class="track"></div><div class="baked"></div><div class="head"></div></div>
  <div id="tl-right">
    <span id="rate-l">Playback 1×</span>
    <input type="range" id="rate" min="-1" max="1" step="0.01" value="0">
  </div>
</div>
<aside id="panel">
  <h1>Bullet vs. water balloon</h1>
  <div class="sub">Ray-traced fluid simulation. Drag to orbit, wheel to zoom, right-drag to pan. Space freezes time; a frozen frame keeps refining. Controls marked ⟳ re-run the simulation.</div>
  <div id="controls"></div>
</aside>
<div id="err"></div>
<script id="shared-src">
/* ==========================================================================
   SHARED PHYSICS SETUP  (evaluated both on the main thread and in the worker)
   Units: SI (m, s, kg).  y is up, ground plane is y = 0.
   ========================================================================== */
var WB_SHARED = (function () {
  'use strict';
  var RHO_W = 1000, RHO_AIR = 1.204, MU_AIR = 1.81e-5;

  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

  /* Deterministic smooth "noise" on the unit sphere.  The exact same formula
     lives in the GLSL so the simulation and the renderer agree on where the
     rubber has torn. */
  function peelNoise(x, y, z) {
    return 0.55 * Math.sin(6.1 * x + 2.3 * y + 1.7) * Math.sin(4.7 * z - 3.1 * x + 0.4) +
           0.35 * Math.sin(9.3 * y - 5.2 * z + 2.2) * Math.cos(7.9 * x + 1.3) +
           0.22 * Math.sin(31.0 * x + 17.0 * y + 0.3) * Math.sin(27.0 * z - 19.0 * x + 1.1);
  }
  /* Latex splits along a few radial cracks that run ahead of the peel, so each
     hole opens as a ragged star whose petals then roll back. */
  // a few irregular, meandering cracks per hole; they run ahead only near the hole
  var CRACKS = [[0.4, 1.0, 1.9, 0.55, 3.3, 0.85, 4.9, 0.4], [0.9, 0.75, 2.6, 1.0, 4.0, 0.45, 5.6, 0.7]];
  function crackSpeed(dx, dy, dz, a, u, v, hole) {
    var x = dx * u[0] + dy * u[1] + dz * u[2], y = dx * v[0] + dy * v[1] + dz * v[2];
    var th = Math.acos(clamp(dx * a[0] + dy * a[1] + dz * a[2], -1, 1));
    var phi = Math.atan2(y, x), s = 0, C = CRACKS[hole];
    for (var i = 0; i < 4; i++) {
      var c = C[2 * i] + 0.35 * Math.sin(6.0 * th + 1.7 * i + hole) + 0.12 * Math.sin(17.0 * th + i);
      var d = phi - c;
      d = d - 6.283185307 * Math.floor((d + 3.141592654) / 6.283185307);
      var wdt = 0.012 + 0.03 * th;                          // cracks widen as the petals open
      s += C[2 * i + 1] * Math.exp(-d * d / wdt);
    }
    return 1 + 2.0 * s * Math.exp(-th / 0.8);
  }

  /* Radius multiplier of a hanging water balloon as a function of c = dir.y.
     Gravity makes it sag into a teardrop: wide, round bottom and a pointed
     top that runs into the neck. */
  function shapeR(c) {
    var cp = c > 0 ? c : 0, cn = c < 0 ? -c : 0;
    var c3 = cp * cp * cp, c12 = c3 * c3 * c3 * c3;
    return 1 + 0.035 * (1 - c * c) + 0.03 * cn * cn - 0.05 * cp * cp + 0.13 * c12;
  }

  /* Time at which the latex peels off the water in direction (dx,dy,dz).
     Tears start at the entry and exit holes and run over the surface at the
     retraction speed; the knot (top) anchors the rubber so the front slows
     towards it and the knot region is uncovered last. */
  function peelT(dx, dy, dz, pp) {
    var nz = 1 + 0.18 * peelNoise(dx, dy, dz);
    var up = 0.5 * (1 + dy);
    var fk = 1 + pp.kappa * up * Math.sqrt(up);
    var thE = Math.acos(clamp(dx * pp.e[0] + dy * pp.e[1] + dz * pp.e[2], -1, 1));
    var tE = pp.tE + thE * fk * nz / (pp.rate * crackSpeed(dx, dy, dz, pp.e, pp.eu, pp.ev, 0));
    if (!pp.hasExit) return tE;
    var thX = Math.acos(clamp(dx * pp.x[0] + dy * pp.x[1] + dz * pp.x[2], -1, 1));
    var tX = pp.tX + thX * fk * nz / (pp.rate * crackSpeed(dx, dy, dz, pp.x, pp.xu, pp.xv, 1));
    return tE < tX ? tE : tX;
  }
  function holeBasis(a) {
    var t = Math.abs(a[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    var u = [a[1] * t[2] - a[2] * t[1], a[2] * t[0] - a[0] * t[2], a[0] * t[1] - a[1] * t[0]];
    var l = Math.hypot(u[0], u[1], u[2]); u = [u[0] / l, u[1] / l, u[2] / l];
    return [u, [a[1] * u[2] - a[2] * u[1], a[2] * u[0] - a[0] * u[2], a[0] * u[1] - a[1] * u[0]]];
  }

  /* Bullet designs, dimensions in calibres d (real projectiles):
       type   0 spitzer (tangent ogive), 1 round nose (elliptical ogive), 2 diabolo pellet
       len    overall length, nose  ogive length, meplat  flat-tip radius / (d/2)
       bt     boat-tail length, base  base radius / (d/2), can  cannelure position (fraction of len, 0 none)
       lead   0 full jacket, 1 jacket with exposed lead base, 2 bare lead
       cd     drag coefficient in water, f0 / rough  jacket reflectance (linear) and roughness */
  var BULLETS = {
    pellet: { type: 2, len: 1.25, nose: 0.5, meplat: 0, bt: 0, base: 1, can: 0, lead: 2, cd: 0.9, f0: [0.56, 0.57, 0.6], rough: 0.4 },
    lr22: { type: 1, len: 1.95, nose: 0.85, meplat: 0.2, bt: 0, base: 1, can: 0, lead: 2, cd: 0.32, f0: [0.6, 0.6, 0.62], rough: 0.36 },
    mm9: { type: 1, len: 1.72, nose: 0.92, meplat: 0.16, bt: 0.05, base: 0.93, can: 0, lead: 1, cd: 0.3, f0: [0.94, 0.72, 0.47], rough: 0.2 },
    r556: { type: 0, len: 4.03, nose: 2.25, meplat: 0.07, bt: 0.7, base: 0.8, can: 0.64, lead: 1, cd: 0.25, f0: [0.955, 0.64, 0.54], rough: 0.2 },
    r762: { type: 0, len: 3.7, nose: 1.95, meplat: 0.07, bt: 0.6, base: 0.84, can: 0.6, lead: 1, cd: 0.25, f0: [0.96, 0.68, 0.52], rough: 0.24 },
    bmg50: { type: 0, len: 4.52, nose: 2.3, meplat: 0.06, bt: 0.74, base: 0.8, can: 0.6, lead: 1, cd: 0.25, f0: [0.955, 0.63, 0.53], rough: 0.22 }
  };

  /* Convert UI parameters into a physical setup shared by sim + renderer. */
  function computeSetup(U) {
    var S = {};
    var R = U.balloonRadius / 100;                 // cm -> m
    var C = [0, U.balloonHeight, 0];
    S.R = R; S.C = C; S.g = U.gravity;
    S.m = U.bulletMass / 1000;                     // g -> kg
    S.d = U.bulletCaliber / 1000;                  // mm -> m
    S.v0 = U.bulletSpeed;
    S.bullet = BULLETS[U.projectile] || BULLETS.lr22;
    S.Cd = S.bullet.cd;                            // drag coefficient in water (subsonic in water: c = 1480 m/s)
    S.A = Math.PI * S.d * S.d / 4;
    S.k = RHO_W * S.Cd * S.A / (2 * S.m);          // exponential velocity decay constant [1/m]
    var oy = clamp(U.impactOffset / 100, -0.8 * R, 0.8 * R);
    S.oy = oy;
    S.dir = [1, 0, 0];

    // Find where the bullet line (y = C.y + oy, z = 0) pierces the membrane.
    function f(x) {
      var dx = x, dy = oy, l = Math.sqrt(dx * dx + dy * dy);
      return l - R * shapeR(dy / l);
    }
    function root(a, b) { // f(a) > 0 > f(b)
      for (var i = 0; i < 60; i++) { var mid = 0.5 * (a + b); if (f(mid) > 0) a = mid; else b = mid; }
      return 0.5 * (a + b);
    }
    var xe = root(-1.5 * R, 0), xx = root(1.5 * R, 0);
    S.entry = [C[0] + xe, C[1] + oy, C[2]];
    S.exit = [C[0] + xx, C[1] + oy, C[2]];
    S.L = xx - xe;                                  // water path length
    var le = Math.sqrt(xe * xe + oy * oy), lx = Math.sqrt(xx * xx + oy * oy);
    S.eDir = [xe / le, oy / le, 0];
    S.xDir = [xx / lx, oy / lx, 0];

    // Ballistics inside the water: dv/ds = -k v  ->  v = v0 e^{-ks}
    S.vExit = S.v0 * Math.exp(-S.k * S.L);
    S.tX = (Math.exp(S.k * S.L) - 1) / (S.k * S.v0);
    S.hasExit = S.vExit > 12;
    S.Edep = 0.5 * S.m * (S.v0 * S.v0 - S.vExit * S.vExit);
    S.etaCav = 0.5;
    S.cavMax = cavityAt(S, 0);                     // largest cavity is at the entry
    S.cavEnd = S.tX + S.cavMax.Tc;

    // Peel (rubber retraction) parameters
    var be = holeBasis(S.eDir), bx = holeBasis(S.xDir);
    S.peel = {
      e: S.eDir, x: S.xDir, eu: be[0], ev: be[1], xu: bx[0], xv: bx[1], tE: 0, tX: S.tX, hasExit: S.hasExit,
      rate: U.peelSpeed / R,                       // angular speed of the tear front [rad/s]
      kappa: 1.25
    };
    // Fraction of the cavity energy left as lasting outward flow: ~0 while the
    // cavity is small compared with the balloon (it collapses and its energy
    // goes into jets, bubbles and heat); approaches 1/2 when the cavity is as
    // large as the balloon and blows it apart.
    S.blast = clamp((S.cavMax.amax / R - 0.45) / 0.55, 0, 1) * 0.5;
    S.tImpact = Math.sqrt(2 * Math.max(0.01, C[1] - 1.03 * R) / Math.max(U.gravity, 0.1));
    S.waterVolume = estimateVolume(R);
    S.waterMass = S.waterVolume * RHO_W;
    // rms speed of the water if the blast share of the deposited energy became outward flow:
    // ~0 for a .22 LR (cavity collapses), ~15 m/s for 5.56 NATO, ~35 m/s for .50 BMG
    S.blastV = Math.sqrt(2 * S.blast * S.Edep / S.waterMass);
    S.violence = clamp(Math.sqrt(S.Edep / 50), 0.3, 7);   // 1 = .22 LR through 15 cm of water
    // the kinematic (collapsing) cavity model only applies while the blast has not blown the water apart
    S.cavKin = 1 - 0.8 * clamp(S.blast / 0.5, 0, 1);
    // Last moment any rubber remains on the water (the knot region)
    var tEnd = 0;
    for (var i = 0; i < 400; i++) {
      var th = Math.acos(1 - 2 * (i + 0.5) / 400), ph = i * 2.39996323;
      var dx = Math.sin(th) * Math.cos(ph), dy = Math.cos(th), dz = Math.sin(th) * Math.sin(ph);
      var tt = peelT(dx, dy, dz, S.peel); if (tt > tEnd) tEnd = tt;
    }
    S.tPeelEnd = tEnd;
    // Knot sits on top of the tapered neck
    S.topY = C[1] + R * shapeR(1);
    S.knot = [C[0], S.topY + 0.012 + 0.10 * R, C[2]];
    return S;
  }

  function estimateVolume(R) {
    var v = 0, n = 200;
    for (var i = 0; i < n; i++) {
      var c = -1 + 2 * (i + 0.5) / n, r = R * shapeR(c);
      v += (r * r * r / 3) * (2 / n) * 2 * Math.PI;   // ∫ r^3/3 dΩ
    }
    return v;
  }

  /* Bullet distance travelled along the path, relative to the entry point. */
  function bulletS(S, t) {
    if (t <= 0) return S.v0 * t;
    if (t <= S.tX) return Math.log(1 + S.k * S.v0 * t) / S.k;
    return S.L + S.vExit * (t - S.tX);
  }
  function bulletV(S, t) {
    if (t <= 0) return S.v0;
    if (t <= S.tX) return S.v0 / (1 + S.k * S.v0 * t);
    return S.vExit;
  }
  /* Time the bullet reaches path coordinate s (relative to entry). */
  function bulletTimeAt(S, s) {
    if (s <= 0) return s / S.v0;
    if (s <= S.L) return (Math.exp(S.k * s) - 1) / (S.k * S.v0);
    return S.tX + (s - S.L) / S.vExit;
  }

  /* Temporary cavity behind the bullet.  The drag work per unit length E'
     opens a (near-vacuum) cylindrical cavity against atmospheric pressure:
     pi a_max^2 p_atm = eta_c E'.  It collapses on a Rayleigh time scale. */
  var P_ATM = 101325;
  function cavityAt(S, s) {
    var v = S.v0 * Math.exp(-S.k * Math.max(0, Math.min(S.L, s)));
    var Ep = S.m * S.k * v * v;
    var amax = Math.sqrt(S.etaCav * Ep / (Math.PI * P_ATM));
    return { amax: amax, Tc: 2.2 * amax * Math.sqrt(RHO_W / P_ATM), Ep: Ep };
  }
  function cavityRadius(S, s, t) {
    if (s < 0 || s > S.L) return 0;
    var tau = t - bulletTimeAt(S, s);
    if (tau <= 0) return 0;
    var c = cavityAt(S, s);
    if (tau >= c.Tc) return 0;
    return c.amax * Math.pow(Math.sin(Math.PI * tau / c.Tc), 0.65);
  }

  function smooth(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  /* Height of the latex tent the bullet pushes out ahead of itself just before it exits. */
  function tentAmp(S, t) {
    if (!S.hasExit) return 0;
    return 0.012 * (S.R / 0.075) * smooth(S.tX - 0.00022, S.tX, t) * (1 - smooth(S.tX, S.tX + 0.0003, t));
  }
  /* Vertical recoil of the knot on the string once the water no longer hangs from it. */
  function knotDY(S, t) {
    var tr = t - 0.65 * S.tPeelEnd;
    if (tr <= 0) return 0;
    var w = 2 * Math.PI * 4.5, z = 0.22;
    return (2.2 / w) * Math.exp(-z * w * tr) * Math.sin(w * tr);
  }

  /* Small deterministic PRNG (mulberry32). */
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Drag relaxation time of a water droplet of radius r moving at speed v in
     air (Schiller-Naumann corrected Stokes drag, evaluated at a representative
     speed so the closed-form linear-drag trajectory is a good fit). */
  function dropletTau(r, v) {
    var d = 2 * r;
    var tauStokes = RHO_W * d * d / (18 * MU_AIR);
    var Re = RHO_AIR * Math.max(v, 0.05) * d / MU_AIR;
    return tauStokes / (1 + 0.15 * Math.pow(Re, 0.687));
  }

  return {
    RHO_W: RHO_W, RHO_AIR: RHO_AIR, MU_AIR: MU_AIR, BULLETS: BULLETS,
    clamp: clamp, peelNoise: peelNoise, shapeR: shapeR, peelT: peelT,
    computeSetup: computeSetup, bulletS: bulletS, bulletV: bulletV,
    bulletTimeAt: bulletTimeAt, rng: rng, dropletTau: dropletTau,
    cavityAt: cavityAt, cavityRadius: cavityRadius, P_ATM: P_ATM,
    smooth: smooth, tentAmp: tentAmp, knotDY: knotDY
  };
})();
if (typeof module !== 'undefined') module.exports = WB_SHARED;
</script>
<script type="text/plain" id="sim-src">

float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
bool boxHit(vec3 ro, vec3 rd, vec3 bmin, vec3 bmax, out float t0, out float t1) {
  vec3 inv = 1.0 / rd; vec3 a = (bmin - ro) * inv, b = (bmax - ro) * inv;
  vec3 lo = min(a, b), hi = max(a, b);
  t0 = max(max(lo.x, lo.y), lo.z); t1 = min(min(hi.x, hi.y), hi.z);
  return t1 > max(t0, 0.0);
}

// ---------------------------------------------------------------- water field
float fieldP(vec3 p) { return textureLod(uVol, (p - uVolMin) / uVolSize, 0.0).r; }
vec2 fieldPA(vec3 p) { return textureLod(uVol, (p - uVolMin) / uVolSize, 0.0).rg; }

// ---------------------------------------------------------------- analytic liquid features
// Coherent liquid structures finer than the particle resolution, added to the density
// field so they are ray traced as water: exit plume core, entry splash cone, cavity-collapse
// jets, and the floor lamella with its rising crown.  Distances in metres, > 0 inside.
uniform vec4 uJetA[4];   // origin.xyz, length (0 = inactive)
uniform vec4 uJetB[4];   // unit axis.xyz, base radius
uniform vec4 uJetC[4];   // cone tan (0 = solid jet), sheet thickness, phase, taper exponent
uniform vec4 uImp;       // floor impact: time, speed, centre x, centre z
uniform vec4 uImp2;      // lamella: initial radius, crown height
uniform vec3 uAnMin, uAnMax;
float jetSD(vec3 p, vec4 A, vec4 B, vec4 C) {
  if (A.w <= 0.0) return -1.0;
  vec3 q = p - A.xyz; float s = dot(q, B.xyz);
  if (s < -0.003 || s > A.w) return -1.0;
  vec3 radial = q - B.xyz * s; float rho = length(radial);
  float x = clamp(s / A.w, 0.0, 1.0);
  if (C.x > 0.0) {                                // hollow splash cone
    float rc = B.w + s * C.x;
    float lump = 1.0 + 0.3 * sin(atan(radial.y, radial.z) * 9.0 + C.z) * x;
    return min(C.y * 0.5 * lump - abs(rho - rc), A.w - s);
  }
  float r = B.w * pow(max(1.0 - x, 0.0), C.w);
  float lam = max(7.0 * r, 0.005) * (0.8 + 0.4 * vnoise2(vec2(s * 40.0, C.z * 0.01)));
  r *= 1.0 + 0.3 * x * sin(6.2832 * s / lam - C.z);                  // Rayleigh-Plateau necking toward the tip
  r *= 0.8 + 0.4 * vnoise2(vec2(s * 120.0 + C.z * 0.1, atan(radial.y, radial.z) * 1.3 + C.z));
  return r - rho;
}
float lamellaR(float tt, float ang) {
  float Rs = uImp2.x + 2.4 * uImp.y * 0.075 * (1.0 - exp(-tt / 0.075));
  vec2 dh = vec2(cos(ang), sin(ang));             // irregular fingering, continuous around the rim
  return Rs * (1.0 + 0.2 * (vnoise2(dh * 4.0 + 3.0) - 0.5) + 0.16 * (vnoise2(dh * 11.0 + 7.0) - 0.5) + 0.08 * (vnoise2(dh * 29.0 + 1.0) - 0.5));
}
float lamellaSD(vec3 p) {
  float tt = uTime - uImp.x;
  if (tt <= 0.0 || p.y > 0.09) return -1.0;
  vec2 d = p.xz - uImp.zw; float r = length(d), ang = atan(d.y, d.x);
  float Rf = lamellaR(tt, ang);
  if (r > Rf + 0.04) return -1.0;
  float hs = max(0.0024, 0.007 * exp(-tt / 0.05)) * (1.0 - 0.45 * smoothstep(0.25 * Rf, Rf, r)) * (1.0 - smoothstep(0.09, 0.22, tt));
  float g = r < Rf ? min(hs - p.y, Rf - r) : -1.0;
  vec2 dh = vec2(cos(ang), sin(ang));
  float H = uImp2.y * smoothstep(0.0, 0.012, tt) * exp(-tt / 0.06) * (0.3 + 0.9 * vnoise2(dh * 9.0 + 5.0) * (0.5 + vnoise2(dh * 23.0 + 2.0)));
  float wall = min(0.003 - abs(r - Rf - p.y * 0.9), H - p.y);
  return max(g, wall);
}
float analyticSD(vec3 p) {
  if (any(lessThan(p, uAnMin)) || any(greaterThan(p, uAnMax))) return -1.0;
  float g = lamellaSD(p);
  for (int i = 0; i < 4 * uL1; i++) g = max(g, jetSD(p, uJetA[i], uJetB[i], uJetC[i]));
  return g;
}
// particle field (+ analytic features), clipped/filled by the latex wherever rubber still covers the water
float field(vec3 p) {
  float f = fieldP(p);
  float ga = analyticSD(p);
  if (ga > -0.02) f = max(f, uIso + ga * uMemSlope);
  if (uMembrane == 0) return f;
  vec3 d = p - uC; float l = length(d);
  if (l < uR * 0.72) return f;
  float sd0 = l - uR * shapeR(d.y / l);
  if (sd0 > 2.5 * uBand + uTent + uLipH + uBulgeMax || sd0 < -uBand) return f;
  float dtp; float sd = memSD(p, dtp);
  if (dtp <= 0.0) return f;
  float fm = uIso - sd * uMemSlope;             // continuous across the latex surface
  return sd > 0.0 ? min(f, fm) : max(f, fm);
}

// ---------------------------------------------------------------- opaque geometry
struct Hit { float t; vec3 n; int m; };   // m: 0 miss, 1 floor, 2 backdrop, 3 string, 4 rubber, 5 bullet, 6 key light, 7 rim light
float hitCyc(vec3 ro, vec3 rd, out vec3 n, out int m) {
  float best = 1e9; n = vec3(0.0, 1.0, 0.0); m = 0;
  if (rd.y < 0.0) {
    float t = -ro.y / rd.y; vec3 p = ro + rd * t;
    if (t > 0.0 && p.z >= -ZB + RC && abs(p.x) < 7.0 && p.z < 7.0) { best = t; n = vec3(0.0, 1.0, 0.0); m = 1; }
  }
  if (rd.z < 0.0) {
    float t = (-ZB - ro.z) / rd.z; vec3 p = ro + rd * t;
    if (t > 0.0 && t < best && p.y >= RC && p.y < 5.0 && abs(p.x) < 7.0) { best = t; n = vec3(0.0, 0.0, 1.0); m = 2; }
  }
  vec2 o = vec2(ro.y - RC, ro.z + ZB - RC), d = rd.yz;
  float a = dot(d, d), b = dot(o, d), c = dot(o, o) - RC * RC, disc = b * b - a * c;
  if (disc > 0.0 && a > 1e-9) {
    float t = (-b + sqrt(disc)) / a; vec3 p = ro + rd * t; vec2 q = vec2(p.y - RC, p.z + ZB - RC);
    if (t > 0.0 && t < best && q.x <= 0.0 && q.y <= 0.0 && abs(p.x) < 7.0) { best = t; n = normalize(vec3(0.0, -q.x, -q.y)); m = 2; }
  }
  return best;
}
float sdTorus(vec3 p, vec2 t) { vec2 q = vec2(length(p.xz) - t.x, p.y); return length(q) - t.y; }
float sdRubber(vec3 p) {
  // tied neck: rolled lip bead + knot loop around the neck
  vec3 k = p - uKnotPos;
  float d = sdTorus(k.xzy * vec3(1.0, 1.0, 1.0) - vec3(0.0, 0.0, 0.0), vec2(0.0042, 0.0023));
  d = min(d, sdTorus(vec3(k.x, k.y - 0.0055, k.z), vec2(0.0028, 0.0017)));
  d = smin(d, sdEllipsoid(k + vec3(0.0, 0.004, 0.0), vec3(0.0036, 0.0065, 0.0036)), 0.002);
  if (uNeckOn > 0.001) {
    vec3 a = vec3(uC.x, uTopY - 0.006, uC.z), b = uKnotPos - vec3(0.0, 0.003, 0.0);
    d = smin(d, sdCapsule(p, a, b, 0.0036 + 0.0016 * uNeckOn), 0.004);
  }
  if (uWadR > 0.0005) {
    // retracted latex: a limp, crumpled rag of thin flaps hanging from the knot
    vec3 w = p - uWadPos; float k = uWadR / 0.011;
    float c1 = cos(1.9), s1 = sin(1.9), c2 = cos(4.1), s2 = sin(4.1);
    vec3 w1 = vec3(c1 * w.x - s1 * w.z, w.y, s1 * w.x + c1 * w.z), w2 = vec3(c2 * w.x - s2 * w.z, w.y, s2 * w.x + c2 * w.z);
    float f1 = sdEllipsoid(w - vec3(0.004, -0.009, 0.0) * k, vec3(0.008, 0.016, 0.0028) * k);
    float f2 = sdEllipsoid(w1 - vec3(0.003, -0.011, 0.001) * k, vec3(0.007, 0.018, 0.0024) * k);
    float f3 = sdEllipsoid(w2 - vec3(0.002, -0.007, 0.0) * k, vec3(0.009, 0.012, 0.003) * k);
    float r1 = 1.0 - abs(noised(w * 210.0).x * 2.0 - 1.0);
    d = smin(d, (min(f1, min(f2, f3)) - 0.0012 * r1) * 0.7, 0.003);
  }
  return d;
}
// (the bullet is a rasterised mesh drawn after the ray tracer: see glsl_rubber.js)
vec3 sdNormal(vec3 p) {
  vec3 g = vec3(0.0);
  for (int k = 0; k < 4 * uL1; k++) {
    vec3 o = vec3(((k + 3) >> 1) & 1, (k >> 1) & 1, k & 1) * 2.0 - 1.0;
    g += o * sdRubber(p + o * 1e-4);
  }
  return normalize(g);
}
float sphereTrace(vec3 ro, vec3 rd, vec3 cen, float rad, float tmax) {
  vec3 oc = ro - cen; float b = dot(oc, rd), c = dot(oc, oc) - rad * rad, disc = b * b - c;
  if (disc < 0.0) return 1e9;
  float t = max(-b - sqrt(disc), 0.0), t1 = min(-b + sqrt(disc), tmax);
  for (int i = 0; i < 64 * uL1; i++) {
    if (t > t1) break;
    vec3 p = ro + rd * t;
    float d = sdRubber(p);
    if (d < 2e-5 * (1.0 + t)) return t;
    t += max(d, 1e-5);
  }
  return 1e9;
}
Hit traceOpaque(vec3 ro, vec3 rd, bool withLights) {
  Hit h; h.m = 0; h.t = 1e9; h.n = vec3(0.0, 1.0, 0.0);
  vec3 n; int m;
  float t = hitCyc(ro, rd, n, m);
  if (m > 0) { h.t = t; h.n = n; h.m = m; }
  // string: vertical cylinder above the knot
  vec2 o = ro.xz - uKnotPos.xz; vec2 d = rd.xz;
  float a = dot(d, d), b = dot(o, d), c = dot(o, o) - 0.0007 * 0.0007, disc = b * b - a * c;
  if (disc > 0.0 && a > 1e-10) {
    float ts = (-b - sqrt(disc)) / a; float y = ro.y + rd.y * ts;
    if (ts > 0.0 && ts < h.t && y > uKnotPos.y && y < 4.5) { h.t = ts; h.n = normalize(vec3(o + d * ts, 0.0).xzy); h.m = 3; }
  }
  // sphere-traced latex knot / neck
  vec3 cen = 0.5 * (uKnotPos + vec3(uC.x, uTopY, uC.z));
  float ts = sphereTrace(ro, rd, cen, 0.5 * length(uKnotPos - vec3(uC.x, uTopY, uC.z)) + 0.012 + 1.6 * uWadR + length(uWadPos - uKnotPos), h.t);
  if (ts < h.t) { h.t = ts; h.n = sdNormal(ro + rd * ts); h.m = 4; }
  if (withLights) {
    float tl;
    if (hitRect(ro, rd, uL0c, uL0u, uL0v, tl) && tl < h.t) { h.t = tl; h.m = 6; }
    if (hitRect(ro, rd, uL1c, uL1u, uL1v, tl) && tl < h.t) { h.t = tl; h.m = 7; }
  }
  return h;
}

// ---------------------------------------------------------------- shadows
// transmittance of the water + latex along a shadow ray (water refracts light
// away, so a thick blob casts a ~70% shadow; latex tints it)
vec3 waterShadow(vec3 p, vec3 target) {
  vec3 T = vec3(1.0);
  vec3 d = target - p; float L = length(d); d /= L;
  if (uMembrane == 1) {
    vec3 oc = p - uC; float b = dot(oc, d), c = dot(oc, oc) - uR * uR * 1.05, disc = b * b - c;
    if (disc > 0.0 && -b - sqrt(disc) > 0.0) {
      vec3 q = p + d * (-b - sqrt(disc));
      if (peelT(normalize(q - uC)) > uTime) T *= mix(vec3(1.0), uRubberCol * 1.2, 0.75) * (1.0 - 0.45 * uRubberOpacity);
    }
  }
  if (uHasVol == 0) return T;
  float t0, t1;
  if (!boxHit(p, d, uVolMin, uVolMin + uVolSize, t0, t1)) return T;
  t0 = max(t0, 0.0); t1 = min(t1, L);
  float st = uCell * 1.6, len = 0.0, aer = 0.0;
  float jit = hash2(FRAGXY + uRand);
  for (int i = 0; i < 160 * uL1; i++) {
    float t = t0 + (float(i) + jit) * st; if (t > t1) break;
    vec2 fa = fieldPA(p + d * t);
    float w = smoothstep(uIso * 0.7, uIso * 1.3, fa.x);
    len += w * st; aer += w * fa.y / max(fa.x, 1e-3) * st;
  }
  return T * mix(uShadowFloor, 1.0, exp(-len * 40.0)) * exp(-aer * 60.0);
}
float waterAO(vec3 p, vec3 n) {
  if (uHasVol == 0) return 1.0;
  float o = 0.0;
  for (int i = 1; i <= 4; i++) {
    float h = 0.006 * float(i * i);
    vec3 q = p + n * h;
    if (any(lessThan(q, uVolMin)) || any(greaterThan(q, uVolMin + uVolSize))) continue;
    o += clamp(fieldP(q) / (uIso * 3.0), 0.0, 1.0) / float(i);
  }
  return clamp(1.0 - 0.55 * o, 0.0, 1.0);
}
uniform vec2 uLJ;           // playback: one softbox sample point per frame for all pixels (the temporal resolve softens it)
vec3 lightSample(vec3 c, vec3 hu, vec3 hv) {
  if (uAccum < 0.5) return c + hu * uLJ.x * 0.9 + hv * uLJ.y * 0.9;
  vec2 r = vec2(hash2(FRAGXY * 1.37 + uRand * 91.0), hash2(FRAGXY.yx * 2.11 + uRand * 57.0)) * 2.0 - 1.0;
  return c + hu * r.x * 0.9 + hv * r.y * 0.9;
}

// ---------------------------------------------------------------- materials
float floorWet(vec2 xz) {
  vec2 uv = (xz + uWetHalf) / (2.0 * uWetHalf);
  if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return 0.0;
  // interpolate per-texel wetness (not wetting times) so edges are smooth, then a noisy soft threshold
  vec2 fr = uv * float(textureSize(uWet, 0).x) - 0.5, i0 = floor(fr); fr -= i0;
  ivec2 mxi = textureSize(uWet, 0) - 1, b0 = clamp(ivec2(i0), ivec2(0), mxi), b1 = clamp(ivec2(i0) + 1, ivec2(0), mxi);
  float dt0 = uTime + (vnoise2(xz * 170.0) - 0.5) * 0.008;
  float w00 = smoothstep(0.0, 0.01, dt0 - texelFetch(uWet, b0, 0).r), w10 = smoothstep(0.0, 0.01, dt0 - texelFetch(uWet, ivec2(b1.x, b0.y), 0).r);
  float w01 = smoothstep(0.0, 0.01, dt0 - texelFetch(uWet, ivec2(b0.x, b1.y), 0).r), w11 = smoothstep(0.0, 0.01, dt0 - texelFetch(uWet, b1, 0).r);
  float wb = mix(mix(w00, w10, fr.x), mix(w01, w11, fr.x), fr.y);
  float edge = 0.3 + 0.4 * vnoise2(xz * 110.0);                 // rounded, lobed wet edge (not a saw-tooth)
  float w = smoothstep(edge - 0.2, edge + 0.2, wb);
  float tt = uTime - uImp.x;
  if (tt > 0.0) { vec2 d = xz - uImp.zw; float Rf = lamellaR(tt, atan(d.y, d.x)); w = max(w, smoothstep(Rf + 0.006, Rf - 0.006, length(d))); }
  return w;
}
vec3 concrete(vec2 xz, out float rough, out vec3 nb) {
  float n1 = vnoise2(xz * 1.7), n2 = vnoise2(xz * 9.0 + 3.1), n3 = vnoise2(xz * 140.0 + 7.7), n4 = vnoise2(xz * 520.0);
  float v = 0.25 * n1 + 0.2 * n2 + 0.3 * n3 + 0.25 * n4;
  vec3 alb = vec3(0.205, 0.2, 0.19) * (0.84 + 0.32 * v);
  alb *= 0.9 + 0.2 * vnoise2(xz * 3.3 + 11.0);                                   // 10-50 cm mottling
  alb *= 1.0 - 0.12 * smoothstep(0.62, 0.8, vnoise2(xz * 6.0 + 4.2));             // old stains
  float jt = abs(fract((xz.x + 0.53) / 1.2) - 0.5) * 1.2;                         // saw-cut control joint every 1.2 m
  alb *= 1.0 - 0.45 * (1.0 - smoothstep(0.0015, 0.004, jt));
  float sp = smoothstep(0.78, 0.86, vnoise2(xz * 1100.0 + 1.3)); alb *= 1.0 - 0.35 * sp;          // dark aggregate
  float fl = smoothstep(0.86, 0.93, vnoise2(xz * 1500.0 + 9.4)); alb *= 1.0 + 0.35 * fl;          // light sand grains
  float pits = smoothstep(0.9, 0.96, vnoise2(xz * 760.0 + 5.1)); alb *= 1.0 - 0.3 * pits;
  rough = 0.55 + 0.15 * n2;
  float e = 1.0 / 1500.0;
  float hx = vnoise2((xz + vec2(e, 0.0)) * 520.0) - n4, hz = vnoise2((xz + vec2(0.0, e)) * 520.0) - n4;
  nb = normalize(vec3(-hx * 0.12, 1.0, -hz * 0.12));
  return alb;
}
vec3 ambientTerm(vec3 n) { return uAmbient * vec3(0.9, 0.95, 1.0) * (0.55 + 0.45 * n.y); }

// direct lighting from both softboxes (diffuse + specular) with water shadows
vec3 directLight(vec3 p, vec3 n, vec3 v, vec3 alb, float rough, vec3 F0) {
  vec3 acc = vec3(0.0);
  for (int li = 0; li < 2 * uL1; li++) {         // both softboxes, one inlined copy
    vec3 c = li == 0 ? uL0c : uL1c, hu = li == 0 ? uL0u : uL1u, hv = li == 0 ? uL0v : uL1v, le = li == 0 ? uL0e : uL1e;
    float e = rectIrr(p, n, c, hu, hv);
    vec3 s = e > 0.0 ? waterShadow(p + n * 1e-3, lightSample(c, hu, hv)) : vec3(1.0);
    acc += (alb / PI * le * e + rectSpec(p, n, v, rough, F0, c, hu, hv, le)) * s;
  }
  return acc;
}
vec3 directLightNS(vec3 p, vec3 n, vec3 v, vec3 alb, float rough, vec3 F0) {
  vec3 acc = vec3(0.0);
  for (int li = 0; li < 2 * uL1; li++) {
    vec3 c = li == 0 ? uL0c : uL1c, hu = li == 0 ? uL0u : uL1u, hv = li == 0 ? uL0v : uL1v, le = li == 0 ? uL0e : uL1e;
    acc += alb / PI * le * rectIrr(p, n, c, hu, hv) + rectSpec(p, n, v, rough, F0, c, hu, hv, le);
  }
  return acc;
}
// cheap environment for reflections: cyclorama + softboxes, no occluders or shadows
vec3 envCheap(vec3 ro, vec3 rd, bool lights) {
  vec3 n; int m; float t = hitCyc(ro, rd, n, m), tl;
  if (lights && hitRect(ro, rd, uL0c, uL0u, uL0v, tl) && tl < t) return rectEmit(ro + rd * tl, uL0c, uL0u, uL0v, uL0e);
  if (lights && hitRect(ro, rd, uL1c, uL1u, uL1v, tl) && tl < t) return rectEmit(ro + rd * tl, uL1c, uL1u, uL1v, uL1e);
  if (m == 0) return studioVoid(rd);
  vec3 p = ro + rd * t;
  vec3 alb = m == 1 ? vec3(0.235, 0.228, 0.215) * (0.78 + 0.44 * vnoise2(p.xz * 11.0)) * mix(1.0, 0.42, floorWet(p.xz)) : vec3(uBackdrop);
  return alb / PI * (uL0e * rectIrr(p, n, uL0c, uL0u, uL0v) + uL1e * rectIrr(p, n, uL1c, uL1u, uL1v)) + alb * ambientTerm(n);
}
`;

/* ==========================================================================
   GLSL: ray tracer main pass.  One light path per pixel is followed through
   up to 8 segments (air -> water -> air -> floor reflection ...).  At every
   dielectric interface the reflected part is evaluated against a cheap
   analytic environment and the path continues along the refracted ray, so
   each expensive routine (scene intersection, volume marching, shadowed
   lighting) has a single call site — keeps the D3D/ANGLE shader compact.
   ========================================================================== */
WB_GLSL.trace = `
uniform float uBubble, uDetail, uClarity, uLensR, uFocus;
uniform vec2 uLens, uJit;
layout(location = 0) out vec4 oColor;
layout(location = 1) out vec4 oDepth;
layout(location = 2) out vec4 oVel;           // object motion (none here: the resolve uses camera motion)

/* One marcher for both directions: from air finds the first point inside the water
   (returns -1 if none before t1); from inside finds the exit (returns t1 if none) and
   integrates the aeration (bubble cloud) along the way. */
float marchSurface(vec3 ro, vec3 rd, float t0, float t1, bool inside, out float aer) {
  aer = 0.0;
  float t = t0 + uCell * (inside ? 0.22 : 0.5 * hash2(gl_FragCoord.xy * 0.73 + uRand * 17.0));
  float last = 0.0;
  for (int i = 0; i < 900 * uL1; i++) {
    vec3 p = ro + rd * t;
    float f = field(p);
    if ((f > uIso) != inside) {
      if (i == 0) return t;
      float a = t - last, b = t;
      for (int k = 0; k < 7 * uL1; k++) { float m = 0.5 * (a + b); if ((field(ro + rd * m) > uIso) != inside) b = m; else a = m; }
      return b;
    }
    float st = uCell * 0.45;
    if (inside) {                                  // bubble cloud: clumpy, sparkly rather than an even haze
      vec2 fa = fieldPA(p);
      float clump = 0.25 + 1.5 * smoothstep(0.35, 0.8, vnoise2(vec2(p.x * 230.0 + p.z * 170.0, p.y * 260.0 - p.z * 90.0)));
      aer += fa.y / max(fa.x, 1e-3) * st * clump;
    }
    else if (f < uIso * 0.02) st = uCell;
    if (t + st > t1) return inside ? t1 : -1.0;
    t += st; last = st;
  }
  return inside ? t : -1.0;
}
vec3 waterNormal(vec3 p) {
  // thin film on the floor: surface tension flattens particle-scale bumps -> wider gradient stencil
  float e = uCell * mix(1.1, 5.0, smoothstep(0.03, 0.006, p.y));

  gl_FragDepth = 0.5 * ndc + 0.5;
}`;

// ---- mist puffs: clouds of micron droplets, strongly forward scattering
WB_GLSL.mistVS = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aCorner;
layout(location = 1) in vec4 aA;   // p0.xyz, t0
layout(location = 2) in vec4 aB;   // v0.xyz, r0
layout(location = 3) in vec4 aC;   // tau, life, seed, density
uniform mat4 uViewProj; uniform vec3 uCamPos, uCamR, uCamU, uCamF;
uniform float uTime, uG, uMist, uAmbient; uniform vec2 uRes; uniform vec2 uJit; uniform vec2 uLensShift;

out vec2 vUV; out vec3 vP; out float vA; out float vR; out float vZ; out vec3 vL;
float hg(float c, float g) { float g2 = g * g; return (1.0 - g2) / (4.0 * 3.14159265 * pow(1.0 + g2 - 2.0 * g * c, 1.5)); }
void main() {
  float dt = uTime - aA.w;

  float tau = aC.x; vec3 vt = vec3(0.0, -uG * tau, 0.0);
  vec3 p = aA.xyz + vt * dt + (aB.xyz - vt) * tau * (1.0 - exp(-dt / tau));
  p.y = max(p.y, 0.004);
  float r = aB.w + 0.06 * sqrt(dt) + 0.25 * tau * length(aB.xyz) * (1.0 - exp(-dt / tau));
  float a = aC.w * uMist * (aB.w * aB.w) / (r * r) * exp(-dt / aC.y) * smoothstep(0.0, 0.00025, dt);

  float ang = aC.z * 6.2831;
  vec2 cr = vec2(cos(ang) * aCorner.x - sin(ang) * aCorner.y, sin(ang) * aCorner.x + cos(ang) * aCorner.y);
  vec3 w = p + (uCamR * cr.x + uCamU * cr.y) * r * 1.8;
  gl_Position = uViewProj * vec4(w, 1.0);
  gl_Position.xy += (uJit * 2.0 / uRes + uLensShift) * gl_Position.w;
  vUV = aCorner * 1.8; vP = p; vA = a; vR = r; vZ = dot(w - uCamPos, uCamF);

  vec3 v = normalize(uCamPos - p), d0 = p - uL0c, d1 = p - uL1c;
  float a0 = 4.0 * length(uL0u) * length(uL0v) * max(dot(normalize(cross(uL0u, uL0v)), normalize(d0)), 0.0) / dot(d0, d0);
  float a1 = 4.0 * length(uL1u) * length(uL1v) * max(dot(normalize(cross(uL1u, uL1v)), normalize(d1)), 0.0) / dot(d1, d1);

uniform sampler2D uDepthTex;

// ---- post
/* Temporal anti-aliasing / upsampling resolve, written at display resolution.
   Every frame the camera is jittered by a sub-pixel offset; the jittered samples
   of the (possibly lower-resolution) render are splatted onto the display grid
   with a Gaussian reconstruction filter and blended into a history buffer:
     mode 0: restart from this frame alone
     mode 1: moving image: history reprojected (camera motion from depth, object
             motion vectors for droplets), clipped to this frame's neighbourhood
             colours (variance clipping in YCoCg) and blended ~1:8
     mode 2: frozen image: plain running average of every sample (supersampling)
   rgb = colour, a = accumulated filter weight. */
WB_GLSL.taaFS = `#version 300 es
precision highp float;
uniform sampler2D uCur, uDepth, uVel, uHist;
uniform vec2 uRenderRes, uOutRes, uJit;
uniform int uMode;
uniform mat4 uPrevVP;
uniform vec3 uCamPos, uCamR, uCamU, uCamF;
uniform float uTanHalf, uAspect, uMaxW;
out vec4 o;
vec3 toYC(vec3 c) { return vec3(0.25 * c.r + 0.5 * c.g + 0.25 * c.b, 0.5 * c.r - 0.5 * c.b, -0.25 * c.r + 0.5 * c.g - 0.25 * c.b); }
vec3 fromYC(vec3 c) { return vec3(c.x + c.y - c.z, c.x + c.z, c.x - c.y - c.z); }
vec3 squash(vec3 c) { return c / (1.0 + max(c.r, max(c.g, c.b))); }
vec3 unsquash(vec3 c) { return c / max(1.0 - max(c.r, max(c.g, c.b)), 1e-3); }
vec4 histCR(vec2 uv) {                          // Catmull-Rom history fetch (5 bilinear taps)
  vec2 ts = vec2(textureSize(uHist, 0)), sp = uv * ts, tp = floor(sp - 0.5) + 0.5, f = sp - tp;
  vec2 w0 = f * (-0.5 + f * (1.0 - 0.5 * f)), w1 = 1.0 + f * f * (-2.5 + 1.5 * f);
  vec2 w2 = f * (0.5 + f * (2.0 - 1.5 * f)), w3 = f * f * (-0.5 + 0.5 * f);
  vec2 w12 = w1 + w2, t12 = (tp + w2 / w12) / ts, t0 = (tp - 1.0) / ts, t3 = (tp + 2.0) / ts;
  vec4 r = texture(uHist, vec2(t12.x, t0.y)) * (w12.x * w0.y) + texture(uHist, vec2(t0.x, t12.y)) * (w0.x * w12.y)
         + texture(uHist, t12) * (w12.x * w12.y) + texture(uHist, vec2(t3.x, t12.y)) * (w3.x * w12.y)
         + texture(uHist, vec2(t12.x, t3.y)) * (w12.x * w3.y);
  float ws = w12.x * w0.y + w0.x * w12.y + w12.x * w12.y + w3.x * w12.y + w12.x * w3.y;
  return max(r / ws, vec4(0.0));
}
void main() {
  vec2 p = gl_FragCoord.xy;
  vec2 q = p * uRenderRes / uOutRes;             // display pixel centre in render-pixel units
  ivec2 c0 = ivec2(floor(q - uJit)), mx = ivec2(uRenderRes) - 1, tn = c0;
  vec3 sum = vec3(0.0), m1 = vec3(0.0), m2 = vec3(0.0), nearest = vec3(0.0);
  float wsum = 0.0, zmin = 1e9, dn = 1e9;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    ivec2 t = clamp(c0 + ivec2(i, j), ivec2(0), mx);
    vec3 c = texelFetch(uCur, t, 0).rgb;
    vec2 d = vec2(t) + 0.5 + uJit - q;
    float d2 = dot(d, d), w = exp(-2.3 * d2);
    sum += c * w; wsum += w;
    vec3 y = toYC(squash(c)); m1 += y; m2 += y * y;
    zmin = min(zmin, texelFetch(uDepth, t, 0).r);
    if (d2 < dn) { dn = d2; nearest = c; tn = t; }
  }
  vec3 cur = wsum > 1e-3 ? sum / wsum : nearest;
  if (uMode == 0) { o = vec4(cur, wsum); return; }
  if (uMode == 2) {
    vec4 h = texelFetch(uHist, ivec2(p), 0);
    float W = h.a + wsum;
    o = vec4((h.rgb * h.a + sum) / max(W, 1e-6), W);
    return;
  }
  vec2 uvp;
  vec4 vel = texelFetch(uVel, tn, 0);
  if (vel.b > 0.3) uvp = p / uOutRes - vel.rg / vel.b;            // droplet: its own motion
  else {                                                            // everything else: camera reprojection
    vec2 ndc = p / uOutRes * 2.0 - 1.0;
    vec3 rd = normalize(uCamF + uCamR * ndc.x * uTanHalf * uAspect + uCamU * ndc.y * uTanHalf);
    vec4 pc = uPrevVP * vec4(uCamPos + rd * (zmin / dot(rd, uCamF)), 1.0);
    uvp = pc.w > 0.0 ? pc.xy / pc.w * 0.5 + 0.5 : vec2(-1.0);
  }
  if (any(lessThan(uvp, vec2(0.0))) || any(greaterThan(uvp, vec2(1.0)))) { o = vec4(cur, wsum); return; }
  vec4 h = histCR(uvp);
  vec3 mu = m1 / 9.0, sg = sqrt(max(m2 / 9.0 - mu * mu, 0.0)) * 1.25 + 1e-4;
  vec3 hy = toYC(squash(h.rgb)), dv = hy - mu;
  vec3 u = abs(dv / sg); float um = max(u.x, max(u.y, u.z));
  vec3 hist = um > 1.0 ? unsquash(fromYC(mu + dv / um)) : h.rgb;
  float hw = min(h.a, uMaxW) * (um > 1.0 ? mix(1.0, 0.5, clamp(um - 1.0, 0.0, 1.0)) : 1.0);
  float W = hw + wsum;
  o = vec4((hist * hw + sum) / W, W);
}`;
WB_GLSL.downFS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uFirst;
out vec4 o;
vec3 s(vec2 uv) { vec3 c = texture(uSrc, uv).rgb; return uFirst > 0.5 ? c / (1.0 + max(c.r, max(c.g, c.b)) * 0.25) : c; }
void main() {
  vec2 uv = gl_FragCoord.xy * 2.0 * uTexel;

  vec3 d = s(uv + t * vec2(-2, 0)), e = s(uv), f = s(uv + t * vec2(2, 0));
  vec3 g = s(uv + t * vec2(-2, -2)), h = s(uv + t * vec2(0, -2)), i = s(uv + t * vec2(2, -2));
  vec3 j = s(uv + t * vec2(-1, 1)), k = s(uv + t * vec2(1, 1)), l = s(uv + t * vec2(-1, -1)), m = s(uv + t * vec2(1, -1));

}`;
WB_GLSL.upFS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uRadius;
out vec4 o;
void main() {
  vec2 uv = gl_FragCoord.xy / vec2(textureSize(uSrc, 0) * 2);
  vec2 t = uTexel * uRadius;
  vec3 r = texture(uSrc, uv).rgb * 4.0;
  r += (texture(uSrc, uv + vec2(-t.x, 0)).rgb + texture(uSrc, uv + vec2(t.x, 0)).rgb + texture(uSrc, uv + vec2(0, -t.y)).rgb + texture(uSrc, uv + vec2(0, t.y)).rgb) * 2.0;
  r += texture(uSrc, uv + vec2(-t.x, -t.y)).rgb + texture(uSrc, uv + vec2(t.x, -t.y)).rgb + texture(uSrc, uv + vec2(-t.x, t.y)).rgb + texture(uSrc, uv + vec2(t.x, t.y)).rgb;
  o = vec4(r / 16.0, 1.0);

WB_GLSL.finalFS = `#version 300 es
precision highp float;
uniform sampler2D uHDR, uBloom; uniform float uExposure, uBloomAmt, uGrain, uTimeSeed, uVignette;
uniform vec2 uOutRes;
out vec4 o;
vec3 aces(vec3 x) {
  const mat3 i = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
  const mat3 oo = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
  x = i * x;
  vec3 a = x * (x + 0.0245786) - 0.000090537, b = x * (0.983729 * x + 0.4329510) + 0.238081;
  return clamp(oo * (a / b), 0.0, 1.0);
}
float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main() {
  vec2 uv = gl_FragCoord.xy / uOutRes;
  // subtle lateral chromatic aberration toward the frame edges
  vec2 dc = (uv - 0.5); float ca = 0.0004 * dot(dc, dc) * 4.0;
  vec3 c;
  c.r = texture(uHDR, uv - dc * ca).r; c.g = texture(uHDR, uv).g; c.b = texture(uHDR, uv + dc * ca).b;
  c += texture(uBloom, uv).rgb * uBloomAmt;
  c *= uExposure;
  float vig = 1.0 - uVignette * smoothstep(0.35, 1.05, length(dc * vec2(1.0, 0.85)) * 1.45);
  c *= vig;
  c = aces(c);
  c = pow(c, vec3(1.0 / 2.2));
  float g = h12(gl_FragCoord.xy + uTimeSeed * 173.0) + h12(gl_FragCoord.yx * 1.3 + uTimeSeed * 71.0) - 1.0;
  float lum = dot(c, vec3(0.299, 0.587, 0.114));
  c += g * uGrain * (0.35 + 0.65 * (1.0 - lum)) * 0.06;
  o = vec4(c, 1.0);
}`;

/* ==========================================================================
   GLSL: caustics by photon tracing.  Each vertex is one photon leaving a
   softbox toward the water; it is refracted into and out of the water volume
   (Fresnel-weighted, latex-tinted) and splatted where it lands on the floor.
   The floor shader adds the resulting irradiance map.
   ========================================================================== */
WB_GLSL.causticVS = `
uniform vec2  uPGrid;                 // photons per side
uniform vec3  uPOrig, uPLn, uPLe;     // photon origin (point on the softbox), softbox normal, radiance
uniform float uPArea;                 // softbox area
uniform vec3  uDiskC, uDiskU, uDiskV; // aim rectangle covering the water volume
uniform vec2  uPJit;
uniform float uCauRes;
out vec3 vFlux;

float pMarchIn(vec3 ro, vec3 rd, float t0, float t1) {
  float st = uCell * 0.6, t = t0;
  for (int i = 0; i < 400 * uL1; i++) {
    if (t > t1) return -1.0;
    if (field(ro + rd * t) > uIso) {
      float a = t - st, b = t;
      for (int k = 0; k < 6 * uL1; k++) { float m = 0.5 * (a + b); if (field(ro + rd * m) > uIso) b = m; else a = m; }
      return b;
    }
    t += st;
  }
  return -1.0;
}
float pMarchOut(vec3 ro, vec3 rd, float t1) {
  float st = uCell * 0.6, t = st * 0.5;
  for (int i = 0; i < 500 * uL1; i++) {
    if (field(ro + rd * t) < uIso) {
      float a = max(t - st, 0.0), b = t;
      for (int k = 0; k < 6 * uL1; k++) { float m = 0.5 * (a + b); if (field(ro + rd * m) < uIso) b = m; else a = m; }
      return b;
    }
    t += st;
    if (t > t1) return t1;
  }
  return t;
}
vec3 pNormal(vec3 p) {
  float e = uCell * 0.9;
  vec3 g = vec3(0.0);
  for (int k = 0; k < 4 * uL1; k++) {
    vec3 o = vec3(((k + 3) >> 1) & 1, (k >> 1) & 1, k & 1) * 2.0 - 1.0;
    g += o * field(p + o * e);
  }
  return dot(g, g) > 1e-12 ? -normalize(g) : vec3(0.0, 1.0, 0.0);
}
float pLatex(vec3 p) {                 // latex coverage at a surface point
  if (uMembrane == 0) return 0.0;
  float dt; float sd = memSD(p, dt);
  return (abs(sd) < uBand * 1.6 && dt > 0.0) ? 1.0 : 0.0;
}
void main() {
  gl_PointSize = 2.0;
  gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
  vFlux = vec3(0.0);
  float n = uPGrid.x;
  float i = mod(float(gl_VertexID), n), j = floor(float(gl_VertexID) / n);
  vec2 uv = (vec2(i, j) + 0.5 + uPJit) / uPGrid * 2.0 - 1.0;
  vec3 tgt = uDiskC + uDiskU * uv.x + uDiskV * uv.y;
  vec3 ro = uPOrig, rd = normalize(tgt - ro);
  float cosE = dot(rd, uPLn);
  if (cosE <= 0.0 || uHasVol == 0) return;
  vec3 dn = normalize(cross(uDiskU, uDiskV));
  float dA = 4.0 * length(uDiskU) * length(uDiskV) / (uPGrid.x * uPGrid.y);
  vec3 flux = uPLe * uPArea * cosE * dA * abs(dot(rd, dn)) / dot(tgt - ro, tgt - ro);
  float t0, t1;
  if (!boxHit(ro, rd, uVolMin, uVolMin + uVolSize, t0, t1)) return;
  float tw = pMarchIn(ro, rd, max(t0, 0.0), t1);
  if (tw < 0.0) return;                           // missed the water: plain direct light handles it
  vec3 p = ro + rd * tw, nrm = pNormal(p);
  if (p.y < 0.016) return;                        // thin films on the floor are optically flat: no focusing
  flux *= 1.0 - fresnelDiel(max(-dot(rd, nrm), 1e-3), 1.333);
  if (pLatex(p) > 0.0) flux *= uRubberCol * (1.0 - 0.6 * uRubberOpacity);
  rd = refract(rd, nrm, 1.0 / 1.333); p -= nrm * 3e-4;
  bool inside = true;
  for (int k = 0; k < 4 * uL1; k++) {
    if (!inside) break;
    float tb0, tb1; boxHit(p, rd, uVolMin, uVolMin + uVolSize, tb0, tb1);
    float tf = rd.y < -1e-5 ? -p.y / rd.y : 1e9;
    float te = pMarchOut(p, rd, min(tb1, tf));
    if (tf <= te + 1e-5) { p += rd * tf; inside = false; break; }   // lands on the floor under the water
    p += rd * te;
    vec3 ne = pNormal(p);
    vec3 td = refract(rd, -ne, 1.333);
    if (dot(td, td) < 0.5) { rd = reflect(rd, ne); p -= ne * 3e-4; continue; }
    flux *= 1.0 - fresnelDiel(max(dot(rd, ne), 1e-3), 1.0 / 1.333);
    if (pLatex(p) > 0.0) flux *= uRubberCol * (1.0 - 0.6 * uRubberOpacity);
    rd = td; p += ne * 3e-4; inside = false;
    if (rd.y >= -1e-4) return;                    // leaves upward: no floor caustic
    p += rd * (-p.y / rd.y);
  }
  if (inside) return;
  vec2 c = (p.xz - uCauMin) / uCauSize;
  if (any(lessThan(c, vec2(0.0))) || any(greaterThan(c, vec2(1.0)))) return;
  float texA = (uCauSize / uCauRes) * (uCauSize / uCauRes);
  vFlux = flux / (texA * 4.0);                    // 2x2 point footprint
  gl_Position = vec4(c * 2.0 - 1.0, 0.0, 1.0);
}`;
WB_GLSL.causticFS = `#version 300 es
precision highp float;
in vec3 vFlux;
out vec4 o;
void main() { o = vec4(vFlux, 0.0); }`;

   GLSL: simulated latex.
   peel*   : rasterises the (fixed) original balloon mesh into the six faces of

             membrane simulation - the ray tracer draws latex wherever that
             time is still in the future.

layout(location = 1) in float aT;

  else if (uFace == 2) f = vec3(d.x, d.z, d.y);

   ray tracer only has to look them up. */

precision highp float;
uniform int uFace; uniform float uN, uTime, uTE, uTX, uR, uCapRing; uniform int uHasExit;

uniform float uBlastV, uBK, uBV0, uBL;         // blast inflation: outflow speed scale, bullet drag constant, speed, path

layout(location = 1) out vec4 oVel;

WB_GLSL.rubberVS = `#version 300 es

layout(location = 1) in vec3 aN;

        for (var i = 0; i < 3; i++) cam.target[i] += (-B.r[i] * dx + B.u[i] * dy) * k;

      }
      resetAccum = true; lastInteract = performance.now();
    });
    function up(e) { delete ptrs[e.pointerId]; if (!Object.keys(ptrs).length) { interacting = false; mode = 0; cv.classList.remove('drag'); } pinch = 0; }
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', function (e) {
      e.preventDefault(); cam.dist = Math.max(0.12, Math.min(6, cam.dist * Math.exp(e.deltaY * 0.0012)));

    }, { passive: false });

  }
  function updateRateLabel() {
    $('rate-l').textContent = 'Playback ' + (speedMul >= 1 ? speedMul.toFixed(speedMul < 3 ? 1 : 0) : speedMul.toFixed(2)) + '×';
  }
  var outW = 0, outH = 0, dynScale = 1, slowFrames = 0, fastFrames = 0;
  /* The canvas backing store always matches the physical display pixels (CSS size x
     devicePixelRatio, capped at 2); the ray tracer renders at renderScale x that and the
     temporal resolve rebuilds the full display resolution from jittered frames. */
  function onResize() {
    var cv = $('view'), dpr = Math.min(window.devicePixelRatio || 1, 2), b = cv.getBoundingClientRect();
    var w = Math.max(64, Math.round(b.width * dpr)), h = Math.max(64, Math.round(b.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    outW = w; outH = h;
    renderer.setOutput(w, h);
    applyScale();
  }
  function applyScale() {
    var sc = U.renderScale * dynScale;
    renderer.resize(Math.round(outW * sc), Math.round(outH * sc));
    resetAccum = true;
  }
  // re-size when the page moves to a screen with a different pixel density (or the browser zoom changes)
  (function watchDPR() {
    if (!window.matchMedia) return;
    var mq = matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
    var fn = function () { if (renderer) onResize(); watchDPR(); };
    if (mq.addEventListener) mq.addEventListener('change', fn, { once: true }); else if (mq.addListener) mq.addListener(fn);

  function halton(i, b) { var f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; }

  function adaptScale(dt, still) {
    if (still) { if (dynScale < 1) { dynScale = 1; applyScale(); } return; }
    if (dt > 0.045) { slowFrames++; fastFrames = 0; } else if (dt < 0.022) { fastFrames++; slowFrames = 0; } else { slowFrames = fastFrames = 0; }
    if (slowFrames > 6 && dynScale > 0.4) { dynScale = Math.max(0.4, dynScale * 0.85); slowFrames = 0; applyScale(); }
    else if (fastFrames > 40 && dynScale < 1) { dynScale = Math.min(1, dynScale * 1.1); fastFrames = 0; applyScale(); }
  }

  // ---------------------------------------------------------------- HUD
  function phase(t) {
    if (t < 0) return 'Bullet in flight · ' + U.bulletSpeed.toFixed(0) + ' m/s';
    if (t < S.tX) return 'Bullet inside the water · ' + SH.bulletV(S, t).toFixed(0) + ' m/s · cavity opening';
    if (t < (store && store.peelEnd ? store.peelEnd : S.tPeelEnd)) return 'Latex tearing along cracks & peeling back · bullet exited at ' + S.vExit.toFixed(0) + ' m/s';
    if (asm && asm.vol && asm.vol.min[1] + 0.3 * asm.vol.cell > 0.02) return 'Unsupported water falling · still holding the balloon’s shape';
    return 'Impact · the water sheets out across the floor';
  }
  function hud() {
    var ms = simT * 1000;
    $('hud-t').textContent = 't = ' + (ms >= 0 ? '+' : '−') + Math.abs(ms).toFixed(ms < 10 && ms > -10 ? 3 : ms < 100 ? 2 : 1) + ' ms';
    $('hud-ph').textContent = phase(simT);
    var r = rate(simT) * speedMul;
    var st = (playing ? 'playing at 1/' + Math.round(1 / r) + ' real speed (≈ ' + Math.round(60 / r).toLocaleString() + ' fps camera)' : 'frozen — orbit freely; image refines (' + renderer.accumN + '/' + U.maxSamples + ')');
    if (buffering) st = 'simulating ahead… ' + st;
    $('hud-s').textContent = st;
    var bt = store ? store.bakedTime() : -1;
    $('stats').textContent = (renderer.W + '×' + renderer.H + ' → ' + renderer.OW + '×' + renderer.OH) + ' · ' + fps.toFixed(0) + ' fps\n' +
      (store ? (store.N + ' particles · sim ' + (store.done ? 'complete' : (bt * 1000).toFixed(0) + ' ms')) : 'initialising simulation…') +
      (asm ? '\ndroplets ' + (asm.fluidCount + (spray ? spray.dropCount : 0)) + ' · mist ' + (spray ? spray.mistCount : 0) : '');
    $('stats').style.whiteSpace = 'pre';
    var sc = $('scrub');
    sc.querySelector('.head').style.left = (tToFrac(simT) * 100) + '%';
    sc.querySelector('.baked').style.width = (store ? (store.done ? 100 : tToFrac(Math.max(bt, tStart)) * 100) : 0) + '%';
  }

  // ---------------------------------------------------------------- main loop
  var lastTickAt = 0, capturing = false;
  function tick(now) {
    if (capturing || !renderer) return;
    if (now === undefined) now = performance.now();
    lastTickAt = performance.now();
    var dt = Math.min(0.1, Math.max(0, (now - lastT) / 1000)); lastT = now;
    frameCount++; fps = fps * 0.95 + (dt > 0 ? 1 / dt : 60) * 0.05;
    if (playing && store && store.count) {     // the clock starts once the first simulated frame exists
      var bt = store.bakedTime();
      var nt = simT + rate(simT) * speedMul * dt;
      if (nt <= 0 || (store && (store.done || nt <= bt))) { simT = nt; buffering = false; }
      else { buffering = true; simT = Math.max(simT, Math.min(nt, Math.max(bt, 0))); }
      if (simT >= U.duration) { simT = U.duration; holdEnd += dt; if (holdEnd > 2.5) { seek(tStart); } }
      needAssemble = true;
    }
    syncMembrane();
    if (needAssemble && store && store.count) {
      store.smooth = U.surfaceSmooth;
      asm = store.assemble(Math.max(simT, 0));
      if (asm.vol) renderer.splat(asm.vol);
      renderer.setInstances('fluid', asm.fluid, asm.fluidCount);
      if (asm.mem) renderer.setMemMesh(asm.mem);
      needAssemble = false; resetAccum = true;
    }
    autoFrame(dt);
    var still = !playing && !interacting && !resetAccum && (now - lastInteract > 60);
    adaptScale(dt, !playing && !interacting);
    hud();
    if (still && renderer.accumN >= U.maxSamples) return;
    draw(still);
  }
  function rafLoop(now) { requestAnimationFrame(rafLoop); tick(now); }
  // when the page is not being composited rAF stalls; keep simulating/rendering on a timer
  setInterval(function () { if (performance.now() - lastTickAt > 250) tick(performance.now()); }, 50);
  function draw(still) {
    var B = camBasis(), fovy = U.fov * Math.PI / 180, aspect = outW / outH;
    // frozen frames integrate a real camera: shutter interval (motion blur) and thin-lens aperture (depth of field)
    var tS = still && U.shutter > 0 ? simT + (Math.random() - 0.5) * U.shutter * 1e-6 : simT;
    var u = Core.sceneUniforms(U, S, tS, asm, store);
    var tanH = Math.tan(fovy / 2), focus = Math.max(0.05, cam.dist);
    var lensR = still ? (0.012 / tanH) / (2 * U.fstop) : 0, lx = 0, ly = 0;
    if (lensR > 0) { var lr = lensR * Math.sqrt(Math.random()), la = Math.random() * 6.2832; lx = lr * Math.cos(la); ly = lr * Math.sin(la); }
    u.uLensR = lensR; u.uLens = [lx, ly]; u.uFocus = focus;
    u.uLensShift = [lx / (focus * tanH * aspect), ly / (focus * tanH)];
    var BL = { pos: [B.pos[0] + B.r[0] * lx + B.u[0] * ly, B.pos[1] + B.r[1] * lx + B.u[1] * ly, B.pos[2] + B.r[2] * lx + B.u[2] * ly], r: B.r, u: B.u, f: B.f };
    seed = (seed + 1) % 100000;
    // temporal AA: restart on jumps, blend with reprojected history while moving, average everything once frozen
    var mode = still ? (lastStill ? 2 : 0) : (histReset ? 0 : 1);
    lastStill = still; histReset = false;
    var hi = mode === 2 ? renderer.accumN + 1 : (frameCount % 16) + 1;           // Halton(2,3): stratified sub-pixel offsets
    var jit = [halton(hi, 2) - 0.5, halton(hi, 3) - 0.5];
    var vp0 = viewProj(B, fovy, aspect, 0.01, 200);
    u.uCamPos = B.pos; u.uCamR = B.r; u.uCamU = B.u; u.uCamF = B.f;
    u.uTanHalf = Math.tan(fovy / 2); u.uAspect = aspect; u.uNear = 0.01; u.uFar = 200;
    // stochastic soft shadows / scattering only once frozen (they converge); playback stays noise-free
    u.uRes = [renderer.W, renderer.H]; u.uFrame = seed; u.uL1 = 1; u.uAccum = still ? 1 : 0; u.uRand = Math.random() * 100; u.uShowRubber = 1;
    u.uLJ = still ? [0, 0] : [2 * halton(hi + 5, 2) - 1, 2 * halton(hi + 5, 3) - 1];
    u.uJit = jit; u.uViewProj = viewProj(BL, fovy, aspect, 0.01, 200);
    u.uVP0 = vp0; u.uPrevVP = mode === 1 && prevVP ? prevVP : vp0;
    u.uPrevTime = mode === 1 ? prevTime : tS;
    var sdb = SH.bulletS(S, tS) - SH.bulletS(S, u.uPrevTime);                      // bullet motion for its motion vectors
    u.uBulletShift = [S.dir[0] * sdb, S.dir[1] * sdb, S.dir[2] * sdb];
    prevVP = vp0; prevTime = tS;
    u.uWetHalf = U._wetHalf || 1.6;
    // ---- caustics: photons from both softboxes through the water onto the floor
    var cauOn = U.caustics !== 'off';
    u.uCauOn = cauOn ? 1 : 0; u.uShadowFloor = cauOn ? 0.08 : 0.3;
    var cc = S.C;
    u.uCauSize = 2.5; u.uCauMin = [cc[0] - 1.25, cc[2] - 1.25]; u.uCauRes = 1024;
    renderer.updateRipples(u);                          // ring pass first: the latex surface (and caustics) use it
    if (cauOn && asm && asm.vol) {
      var V = asm.vol, cv = [V.min[0] + V.size[0] / 2, V.min[1] + V.size[1] / 2, V.min[2] + V.size[2] / 2];
      var rv = 0.5 * Math.hypot(V.size[0], V.size[1], V.size[2]), grid = 200;
      var Ls = [[u.uL0c, u.uL0u, u.uL0v, u.uL0e], [u.uL1c, u.uL1u, u.uL1v, u.uL1e]].map(function (L) {
        var ju = still ? Math.random() * 1.8 - 0.9 : 0, jv = still ? Math.random() * 1.8 - 0.9 : 0;
        var o = [L[0][0] + L[1][0] * ju + L[2][0] * jv, L[0][1] + L[1][1] * ju + L[2][1] * jv, L[0][2] + L[1][2] * ju + L[2][2] * jv];
        var d = norm(sub(cv, o)), du = norm(crossv(d, Math.abs(d[1]) > 0.95 ? [1, 0, 0] : [0, 1, 0])), dv = crossv(du, d);
        var ln = norm(crossv(L[1], L[2]));
        return { uPOrig: o, uPLn: ln, uPLe: L[3], uPArea: 4 * Math.hypot(L[1][0], L[1][1], L[1][2]) * Math.hypot(L[2][0], L[2][1], L[2][2]),
                 uDiskC: cv, uDiskU: du.map(function (x) { return x * rv; }), uDiskV: dv.map(function (x) { return x * rv; }),
                 uPGrid: [grid, grid], uPJit: still ? [Math.random() - 0.5, Math.random() - 0.5] : [0, 0] };

    } else renderer.caustics({ uHasVol: 0 }, [], 0);
    renderer.render(u, { mode: mode, exposure: Math.pow(2, U.exposure), bloom: U.bloom, grain: U.grain,
      vignette: U.vignette, seed: seed });
    resetAccum = false;
  }
  function waitBaked(t, timeoutMs) {
    var t0 = performance.now();
    return new Promise(function (res) {
      (function chk() {
        if (store && store.count && (store.done || store.bakedTime() >= t)) res(true);
        else if (performance.now() - t0 > timeoutMs) res(false);
        else setTimeout(chk, 60);
      })();
    });
  }
  /* Render a converged still of the current state and POST it to the dev server.
     live = true renders what playback shows instead: `samples` temporally resolved
     frames at the normal render scale (no depth of field / shutter). */
  function capture(name, samples, w, h, live) {
    samples = samples || 48;
    play(false);
    capturing = true;
    var cv = $('view');
    w = w || 1280; h = h || 720;
    cv.width = w; cv.height = h; outW = w; outH = h;
    var sc = live ? U.renderScale : 1;
    renderer.setOutput(w, h); renderer.resize(Math.round(w * sc), Math.round(h * sc)); histReset = true;
    return waitBaked(Math.max(simT, 0), 120000).then(function (ok) {
      store.smooth = U.surfaceSmooth;
      syncMembrane();
      asm = store.assemble(Math.max(simT, 0));
      if (asm.vol) renderer.splat(asm.vol);
      renderer.setInstances('fluid', asm.fluid, asm.fluidCount);
      if (asm.mem) renderer.setMemMesh(asm.mem);
      needAssemble = false;
      for (var k = 0; k < 20; k++) autoFrame(0.1);
      resetAccum = true; draw(false);
      for (var i = 1; i < samples; i++) { frameCount++; draw(!live); }
      hud();
      return new Promise(function (res) { $('view').toBlob(res, 'image/png'); });
    }).then(function (blob) {
      return fetch('/capture/' + encodeURIComponent(name), { method: 'POST', body: blob }).then(function (r) { return r.text(); });
    }).then(function (path) { capturing = false; onResize(); return path; }, function (e) { capturing = false; throw e; });
  }

  // ---------------------------------------------------------------- public API (used for scripted screenshots)
  window.WB = {
    play: function () { play(true); }, pause: function () { play(false); },
    seek: function (ms) { seek(ms / 1000); }, time: function () { return simT * 1000; },
    view: function (name) { setView(name); }, views: function () { return Object.keys(VIEWS); },
    orbit: function (az, el, dist, target) { cam.az = az; cam.el = el; if (dist) cam.dist = dist; if (target) { cam.target = target.slice(); cam.auto = false; } resetAccum = true; },
    set: function (k, v) { setParam(k, v); }, get: function (k) { return U[k]; }, params: function () { return JSON.parse(JSON.stringify(U)); },
    info: function () { return { bakedMs: store ? store.bakedTime() * 1000 : -1, done: !!(store && store.done), N: store ? store.N : 0, fps: fps, samples: renderer.accumN, setup: { tExitMs: S.tX * 1e3, vExit: S.vExit, EdepJ: S.Edep, peelEndMs: S.tPeelEnd * 1e3, cavityMaxCm: S.cavMax.amax * 100 } }; },
    capture: capture,
    dbg: function () {                    // diagnostics: density volume of the current frame
      if (!asm || !asm.vol) return null;
      var v = asm.vol, P = store.P, N = store.N, mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
      var bn = [1e9, 1e9, 1e9], bx = [-1e9, -1e9, -1e9], cls = store.cls;
      for (var k = 0; k < N; k++) for (var c = 0; c < 3; c++) {
        mn[c] = Math.min(mn[c], P[3 * k + c]); mx[c] = Math.max(mx[c], P[3 * k + c]);
        if (cls[k] === 0) { bn[c] = Math.min(bn[c], P[3 * k + c]); bx[c] = Math.max(bx[c], P[3 * k + c]); }
      }
      return { volMin: v.min, volSize: v.size, cell: v.cell, dims: [v.nx, v.ny, v.nz], h: v.h, bulk: asm.bulk, drops: asm.iso, allMin: mn, allMax: mx, bulkMin: bn, bulkMax: bx, peelEnd: store.peelEnd, t: asm.t };
    },
    bench: function (n, w, h, scale, live) {   // average GPU time of a frame at w x h (scale = render scale, live = playback frames)
      n = n || 5; capturing = true;
      var cv = $('view'); cv.width = w || 1280; cv.height = h || 720; outW = cv.width; outH = cv.height;
      var sc = scale || 1;
      renderer.setOutput(outW, outH); renderer.resize(Math.round(outW * sc), Math.round(outH * sc)); histReset = true;
      var gl = renderer.gl, px = new Uint8Array(4);
      draw(false); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      var t0 = performance.now();
      for (var i = 0; i < n; i++) { frameCount++; draw(!live); }
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      var ms = (performance.now() - t0) / n;
      capturing = false; onResize();
      return ms;
    },
    ready: function (samples, timeoutMs) {
      samples = samples || 32; timeoutMs = timeoutMs || 60000;
      var t0 = performance.now();
      return new Promise(function (res) {
        (function chk() {
          var ok = store && store.count && (store.done || store.bakedTime() >= simT) && !needAssemble && renderer.accumN >= Math.min(samples, U.maxSamples);
          if (ok || performance.now() - t0 > timeoutMs) res(!!ok); else setTimeout(chk, 100);
        })();
      });
    }
  };

  // ---------------------------------------------------------------- boot
  try {
    // start the physics first so it runs while the GPU driver compiles the shaders
    worker = Core.makeWorker(onWorker);
    bakeId++;
    worker.postMessage({ type: 'bake', id: bakeId, params: JSON.parse(JSON.stringify(U)), slice: worker.local ? 10 : 40 });
    $('hud-t').textContent = 'Compiling ray-tracing shaders…';
    $('hud-ph').textContent = 'first visit only (the browser caches them) — the physics is already simulating';
  } catch (e) { showError(e); }
  // let the notice paint before the (blocking, one-time) shader compile
  setTimeout(function () {
    try {
      renderer = new WB_Renderer($('view'));
      renderer.warmup();
      buildUI(); bindUI(); updateRateLabel();
      onResize();
      setView('hero');
      startBake(true);
      seek(tStart);
      // reduced motion: open on a frozen frame of the peel instead of auto-playing
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { play(false); seek(0.003); }
      requestAnimationFrame(rafLoop);
    } catch (e) { showError(e); }
  }, 60);
})();
